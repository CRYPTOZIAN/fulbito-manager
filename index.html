<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador de Carrera Futbolística</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN SYSTEM  (todo el CSS base va acá, no en JS)
   ============================================================ */
:root{
  --bg:#0a0a0b;--bg2:#0d0d10;--panel:#161618;--panel2:#1b1b1f;--panel3:#222227;
  --bd:#2a2a30;--bd2:#34343c;--tx:#f4f4f6;--mu:#9a9aa6;--mu2:#6c6c78;
  --ac:#e0489b;--ac2:#c026d3;--ind:#6366f1;--ind2:#818cf8;
  --ok:#4ade80;--no:#f87171;--go:#f59e0b;--go2:#fbbf24;
  --fd:#0f5132;--fd2:#14532d;--fl:rgba(255,255,255,.22);
  --r:8px;--rm:14px;--rl:20px;--rx:26px;--rp:999px;
  --sh:0 18px 50px -20px rgba(0,0,0,.8);
  --gO:linear-gradient(150deg,#f472b6,#d946ef 55%,#a21caf);
  --gA:linear-gradient(135deg,#e0489b,#c026d3);
  --F:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --D:'Bricolage Grotesque',Inter,sans-serif;
  --M:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--F);background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background-image:radial-gradient(1200px 600px at 80% -10%,rgba(192,38,211,.10),transparent 60%),
                   radial-gradient(900px 500px at 0% 110%,rgba(99,102,241,.08),transparent 60%)}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
.mono{font-family:var(--M);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mu{color:var(--mu)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.22em;color:var(--mu);text-transform:uppercase}
.wrap{max-width:1280px;margin:0 auto;padding:0 28px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2c2c34;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#3a3a44}

/* ---------- HEADER PROPIO (sin chrome de portal) ---------- */
.gh{position:sticky;top:0;z-index:50;background:rgba(10,10,11,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.gh .row{display:flex;align-items:center;height:62px;gap:16px}
.gh-brand{display:flex;align-items:center;gap:11px;cursor:pointer}
.gh-brand svg{width:26px;height:26px;color:var(--go2);filter:drop-shadow(0 4px 10px rgba(245,158,11,.35))}
.gh-brand .wm{font-family:var(--D);font-weight:800;font-size:22px;letter-spacing:-.01em;line-height:1}
.gh-brand .wm em{font-style:normal;background:var(--gA);-webkit-background-clip:text;background-clip:text;color:transparent}
.gh-brand .sub{font-size:10px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--mu2);align-self:flex-end;margin-bottom:2px}
.lang{margin-left:auto;display:inline-flex;background:var(--panel);border:1px solid var(--bd);border-radius:var(--rp);padding:4px;gap:2px}
.lang button{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:var(--rp);font-weight:700;font-size:13px;color:var(--mu);transition:.2s}
.lang button .fl{width:17px;height:12px;border-radius:2px;object-fit:cover;background:#222}
.lang button .fe{font-size:14px;line-height:1}
.lang button.on{background:#fff;color:#0a0a0b}

/* ---------- BOTONES ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;border-radius:var(--rp);
  transition:transform .15s,box-shadow .2s,background .2s,border-color .2s,filter .2s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-w{background:#fff;color:#0a0a0b;padding:11px 22px;font-size:14px}
.btn-w:hover{box-shadow:0 8px 24px -8px rgba(255,255,255,.5)}
.btn-g{background:transparent;color:var(--tx);border:1px solid var(--bd2);padding:11px 22px;font-size:14px}
.btn-g:hover{border-color:var(--mu);background:rgba(255,255,255,.04)}
.btn-a{background:var(--gA);color:#fff;padding:12px 26px;font-size:15px;box-shadow:0 10px 30px -10px rgba(224,72,155,.7)}
.btn-a:hover{filter:brightness(1.08)}
.btn-lg{padding:15px 34px;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- PANTALLAS ---------- */
.scr{display:none;animation:fadeUp .5s cubic-bezier(.2,.7,.2,1) both}
.scr.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes shimmer{0%,55%{left:-60%}100%{left:130%}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------- LANDING / HERO ---------- */
.hero{display:grid;grid-template-columns:1fr 1.05fr;gap:64px;align-items:center;padding:64px 0 84px}
.hero-art{position:relative;aspect-ratio:1/.78;border-radius:var(--rl);overflow:hidden;
  background:linear-gradient(150deg,#3a0d2e,#7a155f 45%,#c026d3 120%);box-shadow:var(--sh);border:1px solid rgba(255,255,255,.08)}
.hero-art::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 7px);mix-blend-mode:overlay}
.hero-art .sil{position:absolute;bottom:0;background:rgba(255,255,255,.14);border-radius:40px 40px 10px 10px}
.hero-art .sil::before{content:"";position:absolute;left:50%;top:-26px;transform:translateX(-50%);width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.16)}
.hero-art .s1{left:8%;width:74px;height:150px;opacity:.5}
.hero-art .s2{left:38%;width:96px;height:200px;background:rgba(255,255,255,.22)}
.hero-art .s2::before{width:54px;height:54px;top:-32px;background:rgba(255,255,255,.24)}
.hero-art .s3{right:8%;width:80px;height:170px;opacity:.55}
.hero-art .num{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);font-family:var(--D);font-size:120px;font-weight:800;color:rgba(255,255,255,.16);letter-spacing:-.05em}
.hero-art .cup{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:64px;color:#fff;opacity:.92;animation:floaty 4s ease-in-out infinite}
.hero-copy h1{font-family:var(--D);font-size:clamp(40px,5.4vw,66px);line-height:1.02;font-weight:800;letter-spacing:-.03em;margin:14px 0 18px}
.hero-copy h1 em{font-style:normal;background:var(--gA);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-copy p{color:var(--mu);font-size:18px;line-height:1.6;max-width:520px;margin-bottom:26px}
.hero-stats{display:flex;flex-wrap:wrap;gap:10px 22px;margin-bottom:30px;font-family:var(--M);font-size:13px;color:var(--mu)}
.hero-stats b{color:var(--tx);font-weight:700}
.hero-stats i{color:var(--ac);font-style:normal;margin:0 4px}
.hero-actions{display:flex;gap:16px;flex-wrap:wrap}

/* ---------- IDENTIDAD ---------- */
.page-title{font-family:var(--D);font-size:30px;font-weight:800;letter-spacing:-.02em;padding:34px 0 6px}
.id-grid{display:grid;grid-template-columns:300px 1fr 360px;gap:30px;padding:18px 0 50px;align-items:start}
.id-col h3{text-align:center;font-size:18px;font-weight:800;margin-bottom:18px}
.jersey-wrap{display:flex;flex-direction:column;align-items:center;gap:22px}
.jersey{position:relative;width:170px;height:180px;color:#111;background:linear-gradient(180deg,#fff,#e9e9ee);
  clip-path:polygon(28% 0,72% 0,100% 18%,86% 30%,86% 100%,14% 100%,14% 30%,0 18%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 20px 40px -20px rgba(0,0,0,.7)}
.jersey .jn{font-size:13px;font-weight:800;letter-spacing:.08em;color:#222;margin-bottom:2px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jersey .jnum{font-family:var(--D);font-size:54px;font-weight:800;line-height:1;color:#111}
.field-row{display:grid;grid-template-columns:1fr 90px;gap:12px;width:100%}
.field-input{display:flex;flex-direction:column;gap:6px}
.field-input label{font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--mu2);text-align:center}
.inp{background:var(--panel2);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;color:var(--tx);font-size:15px;font-weight:600;width:100%;transition:.2s;text-align:center}
.inp::placeholder{color:var(--mu2);font-weight:600}
.inp:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(224,72,155,.18)}
.seg{display:flex;background:var(--panel2);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.seg button{flex:1;padding:11px 6px;font-weight:700;font-size:13px;color:var(--mu);transition:.2s}
.seg button.on{background:#fff;color:#0a0a0b}
.id-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:14px}

.search-box{position:relative;margin-bottom:14px}
.search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;color:var(--mu2)}
.search-box input{background:var(--panel2);border:1px solid var(--bd);border-radius:var(--r);padding:13px 14px 13px 40px;width:100%;color:var(--tx);font-size:14px}
.search-box input:focus{outline:none;border-color:var(--ind)}
.country-list{max-height:330px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;padding-right:6px}
.country{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:var(--r);transition:.15s;cursor:pointer}
.country:hover{background:var(--panel2)}
.country.sel{background:rgba(99,102,241,.16);box-shadow:inset 0 0 0 1px var(--ind)}
.country .fl{width:26px;height:18px;border-radius:3px;object-fit:cover;background:#222;flex:none}
.country .fe{font-size:18px;line-height:1}
.country span{font-size:14px;font-weight:600}

.pitch{position:relative;aspect-ratio:3/4.1;border-radius:var(--rm);overflow:hidden;
  background:repeating-linear-gradient(0deg,var(--fd) 0 26px,var(--fd2) 26px 52px);border:2px solid var(--fl)}
.pitch::before{content:"";position:absolute;inset:8px;border:2px solid var(--fl);border-radius:6px}
.pitch .mid{position:absolute;left:8px;right:8px;top:50%;height:2px;background:var(--fl)}
.pitch .circle{position:absolute;left:50%;top:50%;width:74px;height:74px;transform:translate(-50%,-50%);border:2px solid var(--fl);border-radius:50%}
.pitch .box-t,.pitch .box-b{position:absolute;left:50%;transform:translateX(-50%);border:2px solid var(--fl);width:46%;height:14%}
.pitch .box-t{top:8px;border-top:none}.pitch .box-b{bottom:8px;border-bottom:none}
.pos{position:absolute;transform:translate(-50%,-50%);background:rgba(8,30,18,.85);border:1px solid rgba(255,255,255,.28);color:#eafff2;
  font-size:11px;font-weight:800;letter-spacing:.03em;padding:7px 9px;border-radius:var(--rp);transition:.15s;backdrop-filter:blur(2px)}
.pos:hover{background:rgba(99,102,241,.55);border-color:#fff;transform:translate(-50%,-50%) scale(1.08)}
.pos.sel{background:var(--gA);border-color:#fff;box-shadow:0 0 0 4px rgba(224,72,155,.3);animation:pop .3s}

/* ---------- COMPONENTES COMUNES (los usan varias pantallas) ---------- */
.career-header{display:flex;align-items:center;gap:22px;background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--rm);padding:14px 22px;margin:24px 0;box-shadow:var(--sh)}
.ch-left{display:flex;align-items:center;gap:12px}
.ch-name{font-family:var(--D);font-size:22px;font-weight:800;letter-spacing:-.02em}
.ovr-badge{background:var(--gO);color:#fff;font-family:var(--D);font-weight:800;font-size:18px;min-width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;border-radius:10px;box-shadow:0 6px 18px -6px rgba(217,70,239,.7);position:relative;overflow:hidden}
.ovr-badge::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-18deg);animation:shimmer 3.4s ease-in-out infinite}
.ch-meta{display:flex;gap:26px;margin-left:8px}
.ch-item{display:flex;flex-direction:column;line-height:1.1}
.ch-k{font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--mu2);text-transform:uppercase}
.ch-v{font-family:var(--D);font-size:20px;font-weight:800;color:var(--ind2)}
.ch-club{margin-left:auto;display:flex;align-items:center;gap:10px;font-weight:700}
.ch-club svg{width:34px;height:39px}

.psych-wrap{display:flex;flex-direction:column}
.psych-row{margin-bottom:14px}
.psych-label{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px}
.psych-val{color:var(--mu)}
.psych-track{height:9px;background:var(--panel3);border-radius:var(--rp);overflow:hidden}
.psych-fill{height:100%;border-radius:var(--rp);transition:width .6s cubic-bezier(.2,.7,.2,1)}
.psych-fill.low{background:linear-gradient(90deg,#ef4444,#f87171)}
.psych-fill.mid{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.psych-fill.high{background:linear-gradient(90deg,#22c55e,#4ade80)}

.ntag{font-size:12px;font-weight:700;padding:5px 11px;border-radius:var(--rp)}
.ntag.good{background:rgba(74,222,128,.14);color:var(--ok)}
.ntag.bad{background:rgba(248,113,113,.14);color:var(--no)}
.ntag-row{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- PLACEHOLDER PROLIJO (módulos de partes futuras) ---------- */
.ph{min-height:62vh;display:flex;align-items:center;justify-content:center;padding:60px 0}
.ph-card{background:var(--panel);border:1px solid var(--bd);border-radius:var(--rl);padding:48px 56px;text-align:center;max-width:560px;box-shadow:var(--sh);position:relative;overflow:hidden}
.ph-card::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.02) 0 2px,transparent 2px 9px);pointer-events:none}
.ph-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(99,102,241,.15);color:var(--ind2);font-weight:800;font-size:12px;letter-spacing:.12em;padding:7px 14px;border-radius:var(--rp);margin-bottom:18px}
.ph-card h2{font-family:var(--D);font-size:26px;font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
.ph-card p{color:var(--mu);line-height:1.6}
.ph-card .ph-part{color:var(--ind2);font-weight:800}

/* ---------- TOAST ---------- */
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:var(--panel3);border:1px solid var(--bd2);
  color:var(--tx);padding:13px 22px;border-radius:var(--rp);font-weight:700;font-size:14px;box-shadow:var(--sh);opacity:0;pointer-events:none;transition:.3s;z-index:200}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ac);margin-right:9px;vertical-align:middle}

/* ---------- RESPONSIVE ---------- */
@media(max-width:980px){
  .hero{grid-template-columns:1fr;gap:34px;padding:40px 0 60px}
  .id-grid{grid-template-columns:1fr;gap:34px}
  .gh-brand .sub{display:none}
}
</style>
</head>
<body>

<!-- HEADER PROPIO DEL JUEGO (marca + idioma, nada de portal) -->
<header class="gh">
  <div class="wrap row">
    <div class="gh-brand" onclick="App.go('landing')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 0 12 0V3H6z"/><path d="M6 5H3v2a3 3 0 0 0 3 3M18 5h3v2a3 3 0 0 1-3 3M9 21h6M12 15v6"/></svg>
      <span class="wm"><em>carrera</em></span>
      <span class="sub" data-i18n="brand_sub">simulador</span>
    </div>
    <div class="lang" role="group" aria-label="Idioma">
      <button data-lang="es" class="on"><span class="fe">🇦</span> ES</button>
      <button data-lang="en"><span class="fe">🇬🇧</span> EN</button>
      <button data-lang="pt"><span class="fe">🇧</span> PT</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="screen-landing"  class="scr"></section>
  <section id="screen-identity" class="scr"></section>
  <section id="screen-player"   class="scr"></section>
  <section id="screen-career"   class="scr"></section>
  <section id="screen-match"    class="scr"></section>
  <section id="screen-offer"    class="scr"></section>
  <section id="screen-press"    class="scr"></section>
  <section id="screen-finance"  class="scr"></section>
  <section id="screen-final"    class="scr"></section>
</main>

<div id="toast"><span class="dot"></span><span id="toast-msg"></span></div>

<!-- ============================================================
     EL <script> QUEDA ABIERTO. NO LO CIERRES.
     Las PARTES 2..9 se pegan DENTRO, antes del marcador final.
     La PARTE 10 trae el </script></body></html>.
     ============================================================ -->
<script>
"use strict";

/* =========================================================
   BUS DE EVENTOS  (acoplamiento entre módulos, sin wrappers)
   try/catch: un bug en un módulo NO rompe a los demás.
   ========================================================= */
window.Bus = {
  _h:{},
  on(e,fn){ (this._h[e]=this._h[e]||[]).push(fn); return fn; },
  off(e,fn){ if(this._h[e]) this._h[e]=this._h[e].filter(f=>f!==fn); },
  emit(e,...a){ (this._h[e]||[]).slice().forEach(fn=>{ try{ fn(...a); }catch(err){ console.warn('[Bus]['+e+']',err); } }); }
};

/* =========================================================
   UTILIDADES GLOBALES
   ========================================================= */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const clamp  = (v,a,b)=>Math.max(a,Math.min(b,v));
const rand   = (a,b)=>Math.random()*(b-a)+a;
const randInt= (a,b)=>Math.floor(rand(a,b+1));
const pick   = arr=>arr[Math.floor(Math.random()*arr.length)];
const chance = p=>Math.random()<p;
const fmtMoney = m => m>=1e6 ? '€'+(m/1e6).toFixed(1)+'M' : m>=1e3 ? '€'+Math.round(m/1e3)+'K' : '€'+Math.round(m);

// ISO-2 -> emoji bandera (fallback offline)
function codeToFlag(code){ return code.toUpperCase().replace(/./g,c=>String.fromCodePoint(127397+c.charCodeAt(0))); }
window.fixFlag = function(img,code){ const s=document.createElement('span'); s.className=(img.className||'fl')+' fe'; s.textContent=codeToFlag(code); img.replaceWith(s); };
function flagImg(code,cls='fl'){ const c=code.toLowerCase(); return `<img class="${cls}" src="https://flagcdn.com/w40/${c}.png" alt="${code}" loading="lazy" onerror="fixFlag(this,'${code}')">`; }

// Escudo SVG con colores reales del club (UID único, sin colisiones)
let _crestUID=0;
function makeCrest(tag,c1,c2){
  const uid='c'+(_crestUID++);
  return `<svg viewBox="0 0 80 92" width="46" height="53" aria-hidden="true">
    <defs><clipPath id="sh${uid}"><path d="M4 4 H76 V46 Q76 76 40 90 Q4 76 4 46 Z"/></clipPath></defs>
    <g clip-path="url(#sh${uid})"><rect width="40" height="92" fill="${c1}"/><rect x="40" width="40" height="92" fill="${c2}"/></g>
    <path d="M4 4 H76 V46 Q76 76 40 90 Q4 76 4 46 Z" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="3"/>
    <text x="40" y="52" text-anchor="middle" font-family="Inter,sans-serif" font-weight="900" font-size="22" fill="#fff" style="paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:2px">${tag}</text>
  </svg>`;
}

// Inyectar CSS por módulo (id único, no duplica). Lo usan las partes 2..10.
function injectCSS(id,css){ if(document.getElementById(id))return; const s=document.createElement('style'); s.id=id; s.textContent=css; document.head.appendChild(s); }

/* =========================================================
   i18n  (cadenas de shell + landing + identidad + comunes)
   ========================================================= */
const I18N = {
  es:{ brand_sub:'simulador',
       hero_title:'Construí tu <em>carrera</em> futbolística',
       hero_text:'Elegí tu origen, tomá decisiones clave y dejá que el destino te lleve a una trayectoria única de títulos, estadísticas y momentos decisivos.',
       start:'Comenzar carrera',
       hero_s1:'decisiones', hero_s2:'clubes reales', hero_s3:'ligas', hero_s4:'partidos en vivo',
       id_title:'Definí tu identidad', col_id:'Identidad', col_nat:'Nacionalidad', col_pos:'Posición',
       surname:'Apellido', number:'Número', foot:'Pierna hábil', left:'Izquierda', right:'Derecha',
       search_country:'Buscar país', back:'Volver', confirm:'Confirmar identidad',

function ensureClubTracking(p){
  if(!p) return;
  p.stats=p.stats||{pj:0,goals:0,assists:0,cleanSheets:0,motm:0,yellows:0,reds:0,trophies:0};
  p.clubStats=p.clubStats||{}; p.clubLog=p.clubLog||[]; p.yearOvr=p.yearOvr||{}; p.trophies=p.trophies||[];
  const cid=p.contract&&p.contract.clubId;
  if(cid){ p.clubStats[cid]=p.clubStats[cid]||{pj:0,goals:0,assists:0,trophies:0};
    if(!p.clubLog.length) p.clubLog.push({clubId:cid,fromYear:p.year,toYear:null}); }
  if(p.year!=null && p.yearOvr[p.year]==null) p.yearOvr[p.year]=p.ovr;
}
// única puerta para sumar stats: actualiza global + por club actual
function addStat(p,key,n){
  n=n||1; ensureClubTracking(p);
  p.stats[key]=(p.stats[key]||0)+n;
  const cid=p.contract&&p.contract.clubId;
  if(cid && (key in p.clubStats[cid])) p.clubStats[cid][key]=(p.clubStats[cid][key]||0)+n;
}
function addTrophy(p,kind){
  ensureClubTracking(p);
  p.stats.trophies=(p.stats.trophies||0)+1;
  const cid=p.contract&&p.contract.clubId;
  if(cid){ p.clubStats[cid].trophies=(p.clubStats[cid].trophies||0)+1; p.trophies.push({clubId:cid,year:p.year,kind:kind||'cup'}); }
}
function adjustPsych(p,d){ for(const k in d) if(p.psych&&p.psych[k]!=null) p.psych[k]=clamp(p.psych[k]+d[k],0,100); }

function weightedPick(arr, wfn){
  const total=arr.reduce((s,x)=>s+wfn(x),0); let r=Math.random()*total;
  for(const x of arr){ r-=wfn(x); if(r<=0) return x; }
  return arr[arr.length-1];
}

}

/* ---------- fórmulas iniciales (la progresión por edad la amplía la Parte 3) ---------- */
function rollOrigin(nationality){
  const ctx=weightedPick(DATA.ORIGINS,o=>o.weight);
  const leagueId=(DATA.LEAGUES.find(l=>l.country===nationality)||{}).id||'ARG';
  let pool=clubsOf(leagueId).filter(c=>c.tier===ctx.tier);
  if(!pool.length) pool=clubsOf(leagueId).filter(c=>c.tier>=ctx.tier-1&&c.tier<=ctx.tier+1);
  if(!pool.length) pool=clubsOf(leagueId);
  return {contextId:ctx.id, clubId:pick(pool).id, leagueId};
}
function calcInitialOVR(position,club,origin){
  const zone=posZone(position);
  const zoneMod={GK:0,DEF:1,MED:0,ATT:1}[zone]||0;
  const clubMod=Math.round((club.ovr-70)/20);
  const base=CONFIG.OVR_START_BASE+zoneMod+(origin.ovrMod||0)+clubMod+randInt(-2,3);
  return clamp(base,CONFIG.OVR_FLOOR,60);
}
function calcPotential(age,ovr,origin,traits){
  let pot=ovr+randInt(18,34)+(origin.potentialMod||0);
  if(traits.includes('ambicioso')) pot+=4;
  if(traits.includes('disciplinado')) pot+=3;
  if(traits.includes('fiestero')) pot-=3;
  return clamp(Math.round(pot),ovr+10,CONFIG.OVR_CAP);
}
function calcInitialValue(ovr,age){
  const base=Math.pow(Math.max(ovr-30,1),2.2)*80;
  const ageFactor=age<16?0.15:1;
  return Math.round(base*ageFactor/1000)*1000;
}
function initPsych(origin){
  const p={};
  DATA.PSYCH.forEach(tr=>{ p[tr.id]=clamp(CONFIG.PSYCH_DEFAULT+randInt(-6,6)+((origin.psych||{})[tr.id]||0),5,95); });
  return p;
}
function rollTraits(position){
  const zone=posZone(position); const traits=new Set();
  const archetype={GK:'cerrojo',DEF:'muro',MED:'creativo',ATT:'goleador'}[zone];
  if(archetype) traits.add(archetype);
  const general=['ambicioso','familiar','fiestero','disciplinado','lider','timido','rebelde','profesional'];
  const target=1+randInt(1,2); let guard=0;
  while(traits.size<target&&guard++<20) traits.add(pick(general));
  return [...traits];
}

/* ---------- creación del jugador ---------- */
function createPlayer(identity){
  const origin=rollOrigin(identity.nationality);
  const originObj=originById(origin.contextId);
  const club=clubById(origin.clubId);
  const traits=rollTraits(identity.position);
  const age=CONFIG.AGE_START;
  const ovr=calcInitialOVR(identity.position,club,originObj);
  const p={
    surname:identity.surname.trim(),
    number:clamp(parseInt(identity.number)||10,1,99),
    foot:identity.foot, nationality:identity.nationality, position:identity.position,
    age, year:CONFIG.YEAR_START,
    ovr, potential:calcPotential(age,ovr,originObj,traits),
    value:calcInitialValue(ovr,age), salary:0,
    psych:initPsych(originObj), traits,
    reputation:randInt(0,5), energy:100, pressRelation:50,
    origin,
    stats:{pj:0,goals:0,assists:0,cleanSheets:0,motm:0,yellows:0,reds:0,trophies:0},
    history:[], trophies:[], awards:[], flags:{}, seen:[], months:0, injuryWeeks:0, season:1,
    contract:{clubId:club.id,yearsLeft:3,salary:0,role:'cantera'}
  };
  App.state.player=p;
  Bus.emit('playerCreated',p);   // Parte 3 agrega attrs; Parte 8 agrega finanzas; etc.
  ensureClubTracking(p);         // registra OVR del año y el club inicial

}

      <div class="panel-card"><h4>${t('personality')}</h4>
        <div class="trait-list">${p.traits.map(id=>`<div class="trait-chip"><b>${traitLabel(id)}</b><span>${traitDesc(id)}</span></div>`).join('')}</div></div>
    </div>
    <div class="stat-cards">
      ${statCard(t('ovr'),p.ovr,'ovr')}
      ${statCard(t('potential'),p.potential,'pot')}
      ${statCard(t('market_value'),fmtMoney(p.value),'val')}
      ${statCard(t('position'),p.position,'pos')}
    </div>
    <div class="player-actions">
      <button class="btn btn-g" id="btn-edit-id">← ${t('edit_identity')}</button>
      <button class="btn btn-g" id="btn-reroll">🎲 ${t('reroll_destiny')}</button>
      <button class="btn btn-a btn-lg" id="btn-begin">${t('begin_story')} →</button>
    </div>`;
  $('#btn-edit-id').onclick=()=>App.go('identity');
  $('#btn-reroll').onclick =()=>{ createPlayer(App.state.identity); RENDERERS.player(); App.toast('🎲 '+t('destiny_changed')); };
  $('#btn-begin').onclick  =()=>App.go('career');
};

/* ---------- PANTALLA: CARRERA intro (la Parte 4 la reemplaza con el motor) ---------- */
RENDERERS.career=function(){
  const p=App.state.player; if(!p){ App.go('identity'); return; }
  const club=clubById(p.contract.clubId);
  $('#screen-career').innerHTML=`
    ${renderCareerHeader(p)}
    <div class="season-intro">
      <div class="season-num">1</div>
      <div><span class="eyebrow">${t('season')} 1 · ${p.year}</span>
        <h2>${t('first_season_title')}</h2>
        <p class="mu">${fill(t('first_season_text'),p)}</p></div>
    </div>
    <div class="ph-card" style="margin:30px auto">
      <div class="ph-badge">⚽ ${t('events_engine')}</div>
      <h2>${t('life_events')}</h2>
      <p class="mu">${t('life_events_text')}<span class="ph-part">${t('ph_part')} 4</span>.</p>
    </div>`;
};
